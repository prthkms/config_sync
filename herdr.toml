onboarding = false

[theme]
name = "kanagawa-lotus"
auto_switch = false

[keys]
previous_workspace = "prefix+-"
next_workspace = "prefix+="

new_tab="prefix+n"
close_tab="prefix+shift+x"

[[keys.command]]
key = "cmd+r"   # many macOS terminals swallow alt+
type = "plugin_action"
command = "persiyanov.reviewr.toggle"
